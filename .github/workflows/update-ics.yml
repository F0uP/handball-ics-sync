name: Spielplan aktualisieren

on:
  schedule:
    # Taeglich 05:00 UTC (~06:00/07:00 Uhr deutscher Zeit, je nach Sommer-/Winterzeit)
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Team-ID hier anpassen, um ein anderes Team zu tracken.
      - name: ICS generieren
        run: node generate_ics.js 81768

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.ics"
          if git diff --staged --quiet; then
            echo "Keine Aenderungen am Spielplan."
          else
            git commit -m "Spielplan automatisch aktualisiert"
            git push
          fi
